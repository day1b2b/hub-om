name: Verify

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://verify:verify@localhost:5432/verify?schema=public
        run: npm run db:validate

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://verify:verify@localhost:5432/verify?schema=public
        run: npm run db:generate

      - name: Lint
        env:
          DATABASE_URL: postgresql://verify:verify@localhost:5432/verify?schema=public
          OPERATION_DATA_SOURCE: local
        run: npm run lint

      - name: Typecheck
        env:
          DATABASE_URL: postgresql://verify:verify@localhost:5432/verify?schema=public
          OPERATION_DATA_SOURCE: local
        run: npm run typecheck

      # 단위 테스트는 순수 함수 검증이라 DB·네트워크가 필요 없다. typecheck·lint가 못 잡는
      # 계산·판정 회귀를 여기서 막는다. build 앞에 두어 빠른 실패가 먼저 보이게 한다.
      - name: Unit tests
        env:
          DATABASE_URL: postgresql://verify:verify@localhost:5432/verify?schema=public
          OPERATION_DATA_SOURCE: local
        run: npm test

      - name: Build
        env:
          DATABASE_URL: postgresql://verify:verify@localhost:5432/verify?schema=public
          OPERATION_DATA_SOURCE: db
        run: npm run build
