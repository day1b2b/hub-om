name: Verify

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Database change review gate
        if: github.event_name == 'pull_request'
        env:
          DATABASE_GUARD_BASE: origin/${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/ci/check-database-change-review.mjs

      - name: Database change review gate tests
        run: node --test scripts/ci/check-database-change-review.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://verify:verify@localhost:5432/verify?schema=public
        run: npm run db:validate

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://verify:verify@localhost:5432/verify?schema=public
        run: npm run db:generate

      - name: Lint
        env:
          DATABASE_URL: postgresql://verify:verify@localhost:5432/verify?schema=public
          OPERATION_DATA_SOURCE: local
        run: npm run lint

      - name: Typecheck
        env:
          DATABASE_URL: postgresql://verify:verify@localhost:5432/verify?schema=public
          OPERATION_DATA_SOURCE: local
        run: npm run typecheck

      # 단위 테스트는 순수 함수 검증이라 DB·네트워크가 필요 없다. typecheck·lint가 못 잡는
      # 계산·판정 회귀를 여기서 막는다. build 앞에 두어 빠른 실패가 먼저 보이게 한다.
      - name: Unit tests
        env:
          DATABASE_URL: postgresql://verify:verify@localhost:5432/verify?schema=public
          OPERATION_DATA_SOURCE: local
        run: npm test

      - name: Build
        env:
          DATABASE_URL: postgresql://verify:verify@localhost:5432/verify?schema=public
          OPERATION_DATA_SOURCE: db
        run: npm run build

  mongo-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://verify:verify@localhost:5432/verify?schema=public
        run: npm run db:generate
      - name: Start isolated Mongo replica set
        run: |
          docker run --detach --name hub-om-mongo-test --publish 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec hub-om-mongo-test mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec hub-om-mongo-test mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec hub-om-mongo-test mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Critical Mongo runtime integration tests
        env:
          MONGODB_OPERATION_WRITE_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          MONGODB_OPERATION_WRITE_COMPOSITION_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          MONGODB_OM_REQUEST_WRITE_RUNTIME_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          MONGODB_OM_REQUEST_WRITE_COMPOSITION_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          MONGODB_OM_REQUEST_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
        run: >-
          node --experimental-strip-types --experimental-test-module-mocks
          --experimental-loader ./scripts/ts-loader.mjs --test
          src/lib/data/mongoOperationWriteRuntime.integration.test.ts
          src/lib/data/mongoOmRequestWriteRuntime.integration.test.ts
          src/lib/data/mongoOmRequestHandlers.integration.test.ts
